<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp F, Calm minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #F5F5F7; --ink: #1D1D1F; --dim: #6E6E73; --link: #0B63CE; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  nav { height: 52px; display: flex; align-items: center; justify-content: center; gap: 40px; font-size: 13px; color: var(--dim); background: rgba(245,245,247,.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
  nav b { color: var(--ink); font-weight: 600; margin-right: 24px; }
  nav a { color: inherit; text-decoration: none; }
  nav a:hover { color: var(--ink); }
  .hero { text-align: center; padding-top: 76px; }
  .eyebrow { font-size: 1.05rem; font-weight: 600; color: var(--dim); }
  h1 { margin-top: 10px; font-weight: 700; font-size: clamp(3.2rem, 6.2vw, 5.6rem); line-height: 1.02; letter-spacing: -0.035em; }
  .sub { margin: 18px auto 0; max-width: 28em; font-size: 1.3rem; line-height: 1.45; color: var(--dim); }
  .links { margin-top: 22px; display: flex; gap: 30px; justify-content: center; font-size: 1.1rem; }
  .links a { color: var(--link); text-decoration: none; }
  .links a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .stage { margin: 52px auto 0; width: min(1040px, calc(100vw - 64px)); border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px -48px rgba(29,29,31,.35); }
  .stage img { display: block; width: 100%; aspect-ratio: 1270 / 350; object-fit: cover; }
  .row { display: flex; justify-content: center; gap: 48px; margin-top: 26px; font-size: .95rem; color: var(--dim); }
  .row b { color: var(--ink); font-weight: 600; margin-right: 6px; }
</style>
</head>
<body>
  <nav><b>Ravindra Sisodia</b><a href="#">Launches</a><a href="#">How I build</a><a href="#">Work</a><a href="#">Contact</a></nav>
  <section class="hero">
    <p class="eyebrow">Designer + AI engineer</p>
    <h1>Designs it. Ships it.</h1>
    <p class="sub">Three Mac apps in the Product Hunt top 10 in seven weeks, built with Claude Code.</p>
    <div class="links"><a href="#">See the launches ›</a><a href="#">Contact ›</a></div>
  </section>
  <figure class="stage"><img src="notch-stage.png" alt="Notchling living in the MacBook notch"></figure>
  <div class="row"><span><b>#3</b>Chit</span><span><b>#7</b>Crew</span><span><b>#8</b>Notchling</span></div>
</body>
</html>
