<!doctype html><html><head><meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,700,401&f[]=satoshi@500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0D0A08; }
  body { position: relative; color: #F3E6D3; font-family: Satoshi, sans-serif; }
  .bg { position: absolute; inset: 0; background: url(og-bg.jpg) 260px center / cover no-repeat; }
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,10,8,.97) 0%, rgba(13,10,8,.85) 38%, rgba(13,10,8,0) 64%); }
  .copy { position: absolute; left: 64px; top: 64px; bottom: 56px; width: 560px; display: flex; flex-direction: column; }
  .who { font: 500 16px/1 "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: #FFC98A; }
  h1 { margin-top: 26px; font: 700 76px/1 Zodiak, serif; letter-spacing: -0.035em; }
  h1 em { font-style: italic; font-weight: 400; color: #FFC98A; }
  .name { margin-top: 22px; font: 500 22px/1.4 Satoshi, sans-serif; color: rgba(243,230,211,.78); }
  .ranks { margin-top: auto; display: flex; gap: 36px; }
  .ranks div { display: flex; align-items: baseline; gap: 10px; }
  .ranks b { font: italic 400 54px/1 Zodiak, serif; color: #FFC98A; letter-spacing: -0.04em; }
  .ranks span { font: 500 15px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
</style></head><body>
<div class="bg"></div><div class="veil"></div>
<div class="copy">
  <p class="who">Ravindra Sisodia · Designer + AI engineer</p>
  <h1>Designs it.<br>Ships it with <em>agents.</em></h1>
  <p class="name">Three Mac apps in the Product Hunt top 10, built with Claude Code.</p>
  <div class="ranks"><div><b>#3</b><span>Chit</span></div><div><b>#7</b><span>Crew</span></div><div><b>#8</b><span>Notchling</span></div></div>
</div>
</body></html>
